name: p2p opstl build

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'develop'


permissions:
  contents: read
  packages: write


env:
  GO_VERSION: 1.24.0
  PROJECT: opstl
  DEVELOP_BRANCH: develop

jobs:
  create-tag:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine Docker Tag
        id: create-tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/${{ env.DEVELOP_BRANCH }}" ]; then
            TAG_PREFIX=$(git rev-parse --short HEAD)
            echo "tag=dev-$TAG_PREFIX" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "Creating a new tag"
              git fetch --tags
              last_tag=$(git describe --tags $(git rev-list --tags --max-count=1))
              if [[ $? -eq 0 ]]; then
                echo "bumping"
                major=$(echo ${last_tag//v} | cut -d. -f1)
                minor=$(echo $last_tag | cut -d. -f2)
                patch=$(echo $last_tag | cut -d. -f3)
                commit_message=$(git log -1 HEAD --pretty=format:%s)
                if [[ $commit_message == *"BREAKING"* ]]; then
                  ((major+=1))
                elif [[ $commit_message == *"FEATURE"* ]]; then
                  ((minor+=1))
                else
                  ((patch+=1))
                fi 
                new_tag="v$major.$minor.$patch"
                echo "New tag to deploy $new_tag"
                echo "tag=$new_tag" >> $GITHUB_OUTPUT
                git tag $new_tag
                git push origin $new_tag
              fi
          else
            echo "Unable to determine tag"
            exit 1
          fi
  build-mac-release:
    needs: create-tag
    if: needs.create-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.create-tag.outputs.tag }}
      GO111MODULE: off
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
    
      - name: Install dependencies
        run: go mod download

      # Build macOS arm64 (Apple Silicon M1/M2)
      - name: Build macOS arm64
        run: |
          GOOS=darwin GOARCH=arm64 go build -o opstl-darwin-arm64 main.go
          tar -czf opstl-darwin-arm64.tar.gz opstl-darwin-arm64
          mv opstl-darwin-arm64.tar.gz $GITHUB_WORKSPACE/

      # Upload to release assets (only when TAG is semver)
      - name: Upload release binaries
        uses: softprops/action-gh-release@v1
        if: startsWith(env.TAG, 'v')
        with:
          tag_name: ${{ env.TAG }}
          files: |
            opstl-darwin-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
